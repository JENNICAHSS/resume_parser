<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser & Search System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Upload Section */
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #5568d3;
            background: #f0f2ff;
        }

        .upload-area .emoji {
            font-size: 48px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .file-label:hover {
            background: #5568d3;
        }

        .selected-file {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            width: auto;
            padding: 12px 30px;
            background: #667eea;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Resume Display */
        #uploadResult {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .resume-details {
            margin-top: 15px;
        }

        .resume-details h3 {
            color: #155724;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .detail-row {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .detail-row strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }

        .skill-tag {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        /* Resume Collection */
        .resume-collection {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .resume-collection h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .resume-item {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .resume-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .resume-item h3 {
            color: #333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resume-item .filename {
            font-size: 0.85em;
            color: #666;
            font-style: italic;
        }

        .resume-item .info {
            font-size: 0.9em;
            color: #555;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .emoji {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-results-count {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin-bottom: 15px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Resume Parser & Search System</h1>
            <p>Upload resumes, extract information, and search through your candidate database</p>
        </header>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalResumes">0</div>
                <div class="label">Total Resumes</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalSkills">0</div>
                <div class="label">Unique Skills</div>
            </div>
            <div class="stat-card">
                <div class="number" id="lastUpdate">Never</div>
                <div class="label">Last Updated</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Upload Section -->
            <div class="card">
                <h2>
                    <span>📤</span>
                    Upload Resume
                </h2>
                
                <div class="upload-area">
                    <div class="emoji">📎</div>
                    <label for="fileInput" class="file-label">Choose Resume File</label>
                    <input type="file" id="fileInput" accept=".pdf,.docx" onchange="showFileName()">
                    <div class="selected-file" id="fileName">No file selected</div>
                </div>
                
                <button onclick="uploadResume()" id="uploadBtn">Upload & Parse Resume</button>
                
                <div id="uploadResult"></div>
            </div>

            <!-- Search Section -->
            <div class="card">
                <h2>
                    <span>🔍</span>
                    Search Resumes
                </h2>
                
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by keyword, skill, name..."
                        onkeypress="if(event.key==='Enter') searchResumes()"
                    >
                    <button onclick="searchResumes()">Search</button>
                </div>

                <div id="searchResults"></div>
            </div>
        </div>

        <!-- Resume Collection -->
        <div class="resume-collection">
            <h2>
                <span>📚</span>
                All Resumes
                <button onclick="loadAllResumes()" style="width: auto; padding: 8px 20px; font-size: 14px; margin-left: auto;">
                    🔄 Refresh
                </button>
            </h2>
            <div id="resumeCollection">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading resumes...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load resumes on page load
        window.onload = function() {
            loadAllResumes();
            loadStats();
        };

        function showFileName() {
            const input = document.getElementById('fileInput');
            const fileNameDiv = document.getElementById('fileName');
            
            if (input.files[0]) {
                const fileName = input.files[0].name;
                const fileSize = (input.files[0].size / 1024).toFixed(2);
                fileNameDiv.innerHTML = `✓ Selected: <strong>${fileName}</strong> (${fileSize} KB)`;
            } else {
                fileNameDiv.textContent = 'No file selected';
            }
        }

        function uploadResume() {
            const fileInput = document.getElementById('fileInput');
            const resultDiv = document.getElementById('uploadResult');
            const uploadBtn = document.getElementById('uploadBtn');
            
            if (!fileInput.files[0]) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Please select a file first!';
                resultDiv.style.display = 'block';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Uploading and parsing...</p></div>';
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Processing...';
            
            fetch('http://127.0.0.1:5000/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Parse Resume';
                
                if (data.message && data.message.includes('successfully')) {
                    displayUploadSuccess(data.data);
                    loadAllResumes(); // Refresh the collection
                    loadStats(); // Update stats
                    fileInput.value = ''; // Clear file input
                    document.getElementById('fileName').textContent = 'No file selected';
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = '❌ ERROR: ' + (data.error || 'Unknown error');
                }
            })
            .catch(error => {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Parse Resume';
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ Upload failed!<br><br>Error: ${error.message}<br><br>Make sure your server is running: <code>python app.py</code>`;
            });
        }

        function displayUploadSuccess(data) {
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.className = 'success';
            
            let html = `
                <div class="resume-details">
                    <h3>✅ Resume Parsed Successfully!</h3>
                    
                    <div class="detail-row">
                        <strong>📝 Name:</strong>
                        ${data.name}
                    </div>
                    
                    <div class="detail-row">
                        <strong>💼 Experience:</strong>
                        ${data.experience}
                    </div>
                    
                    <div class="detail-row">
                        <strong>🎓 Education:</strong>
                        ${data.education && data.education.length > 0 ? data.education.join('<br>') : 'Not specified'}
                    </div>
                    
                    <div class="detail-row">
                        <strong>🛠️ Skills (${data.skills.length}):</strong>
                        <div class="skills-list">
                            ${data.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                        </div>
                    </div>
                    
                    <div class="detail-row">
                        <strong>📄 Filename:</strong>
                        ${data.filename}
                    </div>
                </div>
            `;
            
            resultDiv.innerHTML = html;
        }

        function searchResumes() {
            const keyword = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            
            if (!keyword) {
                resultsDiv.innerHTML = '<div class="error" style="display: block;">Please enter a search keyword</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Searching...</p></div>';
            
            fetch(`http://127.0.0.1:5000/search?keyword=${encodeURIComponent(keyword)}`)
                .then(response => response.json())
                .then(data => {
                    displaySearchResults(data, keyword);
                })
                .catch(error => {
                    resultsDiv.innerHTML = `<div class="error" style="display: block;">Search failed: ${error.message}</div>`;
                });
        }

        function displaySearchResults(data, keyword) {
            const resultsDiv = document.getElementById('searchResults');
            
            if (data.count === 0) {
                resultsDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🔍</div>
                        <p>No resumes found matching "${keyword}"</p>
                    </div>
                `;
                return;
            }
            
            let html = `<div class="search-results-count">Found ${data.count} result(s)</div>`;
            
            data.results.forEach(resume => {
                html += `
                    <div class="resume-item" onclick="openResume('${resume.filename}')" style="cursor:pointer;" title="Click to open original resume">
                        <h3>
                            ${resume.name}
                            <span class="filename">${resume.filename}</span>
                            <span style="font-size:0.75em; color:#667eea; margin-left:8px;">📄 Click to open</span>
                        </h3>
                        <div class="skills-list">
                            ${resume.skills.slice(0, 8).map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                            ${resume.skills.length > 8 ? `<span class="skill-tag">+${resume.skills.length - 8} more</span>` : ''}
                        </div>
                        <div class="info">
                            💼 ${resume.experience} | 🎓 ${resume.education[0] || 'Not specified'}
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        function openResume(filename) {
            window.open(`http://127.0.0.1:5000/resume/${filename}`, '_blank');
        }

        function loadAllResumes() {
            const collectionDiv = document.getElementById('resumeCollection');
            
            collectionDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading resumes...</p></div>';
            
            fetch('http://127.0.0.1:5000/resumes')
                .then(response => response.json())
                .then(data => {
                    displayAllResumes(data.resumes);
                })
                .catch(error => {
                    collectionDiv.innerHTML = `<div class="error" style="display: block;">Failed to load resumes: ${error.message}</div>`;
                });
        }

        function displayAllResumes(resumes) {
            const collectionDiv = document.getElementById('resumeCollection');
            
            if (!resumes || resumes.length === 0) {
                collectionDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">📭</div>
                        <p>No resumes uploaded yet</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Upload your first resume to get started!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            resumes.forEach((resume, index) => {
                html += `
                    <div class="resume-item" onclick="openResume('${resume.filename}')" style="cursor:pointer;" title="Click to open original resume">
                        <h3>
                            ${resume.name}
                            <span class="filename">${resume.filename}</span>
                            <span style="font-size:0.75em; color:#667eea; margin-left:8px;">📄 Click to open</span>
                        </h3>
                        <div class="skills-list">
                            ${resume.skills.slice(0, 10).map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                            ${resume.skills.length > 10 ? `<span class="skill-tag">+${resume.skills.length - 10} more</span>` : ''}
                        </div>
                        <div class="info">
                            💼 ${resume.experience} | 🎓 ${resume.education[0] || 'Not specified'}
                        </div>
                    </div>
                `;
            });
            
            collectionDiv.innerHTML = html;
        }

        function loadStats() {
            fetch('http://127.0.0.1:5000/stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalResumes').textContent = data.total_resumes;
                    document.getElementById('totalSkills').textContent = data.total_unique_skills;
                    
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('lastUpdate').textContent = timeStr;
                })
                .catch(error => {
                    console.error('Failed to load stats:', error);
                });
        }
    </script>
</body>
</html>
